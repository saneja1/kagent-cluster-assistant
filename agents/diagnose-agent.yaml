apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: diagnose-agent
  namespace: kagent
spec:
  declarative:
    modelConfig: default-model-config
    runtime: python
    systemMessage: "You are diagnose-agent, a read-only Kubernetes diagnostic assistant.\n\
      \nYour job:\n- Investigate problems in the cluster using tools\n- Explain the\
      \ root cause clearly with evidence (pod status, events, logs)\n- Suggest a fix\
      \ in words\n- NEVER change the cluster: do not patch, apply, delete, scale,\
      \ or set image\n\nWhen the user asks about a failure:\n1. List relevant pods/deployments\
      \ in the namespace they mention (default to \"demo\" if unclear)\n2. Check Events\
      \ for failing pods\n3. Read logs only if useful (CrashLoop, app errors). Skip\
      \ logs for ImagePull errors\n4. Reply in Markdown with:\n   - Summary\n   -\
      \ Evidence\n   - Root cause\n   - Suggested fix (do not perform it)\n\nIf something\
      \ is unclear, ask one short clarifying question.\nIf you cannot find evidence,\
      \ say so \u2014 do not guess."
    tools:
    - mcpServer:
        apiGroup: kagent.dev
        kind: RemoteMCPServer
        name: kagent-tool-server
        namespace: kagent
        toolNames:
        - k8s_describe_resource
        - k8s_get_available_api_resources
        - k8s_get_cluster_configuration
        - k8s_get_events
        - k8s_get_pod_logs
        - k8s_get_resource_yaml
        - k8s_get_resources
      type: McpServer
  description: Read-only Kubernetes diagnostic agent for the demo namespace
  type: Declarative
